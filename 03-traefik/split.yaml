
http:
  routers:
    allBackendRouter:
      rule: "Host(`localhost`) && Path(`/`)"
      service: allBackend
    app1router:
      rule: "Host(`localhost`) && Path(`/app1`)"
      service: app1backend
    app2router:
      rule: "Host(`localhost`) && Path(`/app2`)"
      service: app2backend

  services:
    allBackend:
      loadBalancer:
        servers:
          - url: 'http://localhost:1111/'
          - url: 'http://localhost:2222/'
          - url: 'http://localhost:3333/'
          - url: 'http://localhost:4444/'

    app1backend:
      loadBalancer:
        servers:
          - url: 'http://localhost:1111/'
          - url: 'http://localhost:2222/'

    app2backend:
      loadBalancer:
        servers:
          - url: 'http://localhost:3333/'
          - url: 'http://localhost:4444/'
