http:  # Layer 7 proxying
  routers:
    allBackendRouter:
      rule: Host(`localhost`)
      service: allBackend
  services:
    allBackend:
      loadBalancer:
        servers:
          - url: 'http://localhost:1111/'
          - url: 'http://localhost:2222/'
          - url: 'http://localhost:3333/'
          - url: 'http://localhost:4444/'